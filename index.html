    <style>
        /* Base Reset & Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 1. Looping Video Background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.35;
            /* Darkened background for high text readability */
            pointer-events: none;
        }

        /* Premium Guns.lol Frosted Glass Card */
        .profile-card {
            background: rgba(10, 10, 12, 0.45);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 2. Neon-Border Profile Picture Container */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.4s ease;
        }

        /* Glowing Ring Behind Avatar */
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid #8a2be2;
            opacity: 0.5;
            box-shadow: 0 0 15px #8a2be2;
            z-index: -1;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .profile-card:hover .avatar {
            transform: scale(1.06) rotate(3deg);
        }

        /* Main Identity Typography */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 40%, #c5a3ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a3a3a8;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* Individual Interactive Link Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            text-decoration: none;
            color: #e2e2e5;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 15px 20px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
        }

        /* Modern Slide-Up Hover State */
        .btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #08080a;
            border-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.25);
            font-weight: 600;
        }

        /* Dynamic Animations */
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
                filter: hue-rotate(0deg);
            }

            50% {
                transform: scale(1.02);
                opacity: 0.7;
                filter: hue-rotate(45deg);
            }
        }
    </style>
